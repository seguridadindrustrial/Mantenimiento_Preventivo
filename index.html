
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Mantenimiento preventivo y correctivo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="image">
        <img src="logo cc.soul.jpg" alt="Logo" width="50" height="50"> 
        <h1>CCS.CATERING</h1>
    </div>
    

    <div class="container">
        <h1>MANTENIMIENTOS PREVENTIVOS Y CORRECTIVOS</h1>

        <div id="loginSection">
            <div class="form-group">
                <label for="codigoTecnico">Codigo de Tecnico</label>
                <input type="text" id="codigoTecnico" placeholder="Ej: 001" maxlength="10">
            </div>
            <div class="form-actions">
                <button type="button" class="btn-primary" id="btnLogin">Ingresar</button>
            </div>
            <p id="loginError" style="color:#ef4444;font-size:0.85rem;display:none;margin-top:10px;">Codigo no valido.</p>
        </div>

        <form id="checkinForm" style="display:none;">
            <p id="tecnicoInfo" style="background:#e8f5e9;padding:10px;border-radius:8px;font-weight:600;color:#2e7d32;margin-bottom:20px;"></p>

            <div class="form-group">
                <label for="sedes">Sedes</label>
                <select id="sedes" name="sedes" required>
                    <option value="" disabled selected>Seleccionar sede...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="hora">Hora</label>
                <input type="time" id="hora" name="hora" required>
            </div>

            <div class="form-group">
                <label for="equipo">Equipo</label>
                <select id="equipo" name="equipo" required>
                    <option value="" disabled selected>Seleccionar equipo...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="mantenimiento">Mantenimiento</label>
                <select id="mantenimiento" name="mantenimiento" required>
                    <option value="" disabled selected>Seleccionar mantenimiento...</option>
                </select>
            </div>

            <div class="form-group">
                <label>Rutina</label>
                <div id="checkinsContainer" class="checkins-container">
                
                </div>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripcion (opcional)</label>
                <textarea id="descripcion" name="descripcion" rows="3" placeholder="Observaciones adicionales..."></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Enviar</button>
                <button type="button" class="btn-secondary" id="btnLimpiar">Limpiar</button>
            </div>
        </form>
    </div>

    <script src="app.js"></script>

    <footer>
        <p>© 2026 Caracas Soul. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
