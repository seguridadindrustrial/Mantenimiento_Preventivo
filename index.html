
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Mantenimiento preventivo y correctivo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="image">
        <img src="logo cc.soul.jpg" alt="Logo" width="50" height="50"> 
        <h1>CCS.CATERING</h1>
    </div>

    <div class="container">
        <h1> GERENCIA DE SEGURIDAD INDUSTRIAL Y MANTENIMIENTO</h1>
        <P>Reporte de averias/ Reporte de mantenimiento preventivo</P>
        <br>

        <div id="loginSection">
            <div class="form-group">
                <label for="codigoTecnico">Usuario</label>
                <input type="text" id="codigoTecnico" placeholder="Ingresa tu cedula o codigo de averia" maxlength="20">
            </div>
            <div class="form-actions">
                <button type="button" class="btn-primary" id="btnLogin">Ingresar</button>
            </div>
            <p id="loginError" style="color:#ef4444;font-size:0.85rem;display:none;margin-top:10px;">Codigo no valido.</p>
        </div>

        <form id="checkinForm" style="display:none;" novalidate>
            <p id="tecnicoInfo" style="background:#e8f5e9;padding:10px;border-radius:8px;font-weight:600;color:#2e7d32;margin-bottom:20px;"></p>

            <div id="paso1">
                <div class="form-group">
                    <label for="sedes">Sede</label>
                    <select id="sedes" name="sedes" required>
                        <option value="" disabled selected>Seleccionar sede...</option>
                    </select>
                </div>

                <div class="form-group" id="zonaGroup" style="display:none;">
                    <label for="zona">Zona</label>
                    <select id="zona" name="zona">
                        <option value="" disabled selected>Seleccionar zona...</option>
                    </select>
                </div>

                <div class="row-fecha-hora">
                    <div class="form-group half">
                        <label for="fecha">Fecha</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </div>

                    <div class="form-group half">
                        <label>Hora</label>
                        <div class="time-picker">
                            <select id="horaHora" required>
                                <option value="" disabled selected>HH</option>
                            </select>
                            <span class="time-sep">:</span>
                            <select id="horaMinuto" required>
                                <option value="" disabled selected>MM</option>
                            </select>
                            <select id="horaPeriodo" class="time-periodo" required>
                                <option value="" disabled selected>AM/PM</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-group" id="equipoGroup">
                    <label for="equipo">Equipo</label>
                    <select id="equipo" name="equipo" required>
                        <option value="" disabled selected>Seleccionar equipo...</option>
                    </select>
                </div>

                <div class="form-group" id="equipoExteriorGroup" style="display:none;">
                    <label for="equipoExterior">Equipo</label>
                    <input type="text" id="equipoExterior" placeholder="Escribe el nombre del equipo...">
                </div>

                <div class="form-group" id="equipoOtroGroup" style="display:none;">
                    <label for="equipoOtro">Nombre del equipo</label>
                    <input type="text" id="equipoOtro" placeholder="Escribe el nombre del nuevo equipo...">
                </div>

                <div class="form-group" id="mantenimientoGroup">
                    <label for="mantenimiento"> Mantenimiento</label>
                    <select id="mantenimiento" name="mantenimiento" required>
                        <option value="" disabled selected>Seleccionar mantenimiento...</option>
                    </select>
                </div>

                <div class="form-actions" id="formActions">
                    <button type="button" class="btn-primary" id="btnSiguiente">Siguiente</button>
                </div>
            </div>

            <div id="paso2" style="display:none;">
                <div class="form-group">
                    <label>Rutina</label>
                    <div id="checkinsContainer" class="checkins-container"></div>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripcion (opcional)</label>
                    <textarea id="descripcion" name="descripcion" rows="3" placeholder="Observaciones adicionales..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="btnAtras">Atras</button>
                    <button type="button" class="btn-primary" id="btnPaso3" style="display:none;">Siguiente</button>
                    <button type="submit" class="btn-primary" id="btnEnviar">Enviar</button>
                </div>
            </div>

            <div id="paso3" style="display:none;">
                <div class="form-group">
                    <label>Repuestos</label>
                    <p class="hint">¿Se necesitan repuestos para este mantenimiento?</p>
                    <div class="toggle-group">
                        <button type="button" class="toggle-btn" id="repSi" data-value="Si" onclick="toggleRepuestosToggle(this)">Si</button>
                        <button type="button" class="toggle-btn" id="repNo" data-value="No" onclick="toggleRepuestosToggle(this)">No</button>
                    </div>
                </div>

                <div class="form-group" id="repuestosGroup" style="display:none;">
                    <label>Agregar repuestos</label>
                    <div id="repuestosRows"></div>
                    <button type="button" class="btn-secondary btn-add" id="btnAgregarRepuesto" onclick="agregarRepuestoRow()">＋ Agregar repuesto</button>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="btnAtras3">Atras</button>
                    <button type="submit" class="btn-primary">Enviar</button>
                </div>
            </div>
        </form>

        <form id="averiaForm" style="display:none;" novalidate>
            <p id="empleadoInfo" class="info-banner"></p>

            <div class="form-group">
                <label for="aSedes">Sede</label>
                <select id="aSedes" name="aSedes" required>
                    <option value="" disabled selected>Seleccionar sede...</option>
                </select>
            </div>

            <div class="form-group" id="aZonaGroup" style="display:none;">
                <label for="aZona">Zona</label>
                <select id="aZona" name="aZona">
                    <option value="" disabled selected>Seleccionar zona...</option>
                </select>
            </div>

            <div class="row-fecha-hora">
                <div class="form-group half">
                    <label for="aFecha">Fecha</label>
                    <input type="date" id="aFecha" name="aFecha" required>
                </div>

                <div class="form-group half">
                    <label>Hora</label>
                    <div class="time-picker">
                        <select id="aHoraHora" required>
                            <option value="" disabled selected>HH</option>
                        </select>
                        <span class="time-sep">:</span>
                        <select id="aHoraMinuto" required>
                            <option value="" disabled selected>MM</option>
                        </select>
                        <select id="aHoraPeriodo" class="time-periodo" required>
                            <option value="" disabled selected>AM/PM</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group" id="aEquipoGroup">
                    <label for="aEquipo">Equipo</label>
                <select id="aEquipo" name="aEquipo" required>
                    <option value="" disabled selected>Seleccionar equipo...</option>
                </select>
            </div>

            <div class="form-group" id="aEquipoLibreGroup" style="display:none;">
                <label for="aEquipoLibre">Equipo del evento</label>
                <input type="text" id="aEquipoLibre" placeholder="Escribe el equipo...">
                <label for="aEventoLibre" style="margin-top:12px;">Evento</label>
                <input type="text" id="aEventoLibre" placeholder="Nombre del evento...">
            </div>

            <div class="form-group" id="aEquipoExteriorGroup" style="display:none;">
                <label for="aEquipoExterior">Equipo</label>
                <input type="text" id="aEquipoExterior" placeholder="Escribe el nombre del equipo...">
            </div>

            <div class="form-group" id="aEquipoOtroGroup" style="display:none;">
                <label for="aEquipoOtro">Nombre del equipo</label>
                <input type="text" id="aEquipoOtro" placeholder="Escribe el nombre del nuevo equipo...">
            </div>

            <div class="form-group">
                <label>¿El equipo presenta una averia?</label>
                <div class="toggle-group">
                    <button type="button" class="toggle-btn" id="aAvSi" data-value="Si" onclick="toggleAveriaToggle(this)">Si</button>
                    <button type="button" class="toggle-btn" id="aAvNo" data-value="No" onclick="toggleAveriaToggle(this)">No</button>
                </div>
            </div>

            <div id="aAveriaDetalle" style="display:none;">
                <div class="form-group">
                    <label for="aDescripcion">Descripcion de la averia</label>
                    <textarea id="aDescripcion" rows="3" placeholder="Describe que le pasa al equipo..."></textarea>
                </div>

                <div class="form-group">
                    <label for="aImagenes">Fotos (maximo 2)</label>
                    <div class="photo-buttons">
                        <label for="aImagenes" class="btn-photo">Tomar foto</label>
                        <label for="aImagenesUpload" class="btn-photo btn-photo-alt">Subir foto</label>
                    </div>
                    <input type="file" id="aImagenes" accept="image/*" capture="environment" style="display:none;">
                    <input type="file" id="aImagenesUpload" accept="image/*" multiple style="display:none;">
                    <div id="aImagenesPreview" class="imagenes-preview"></div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary" id="enviarAveriaBtn">Enviar averia</button>
            </div>
        </form>

        <form id="resolucionForm" style="display:none;" novalidate>
            <p id="resolucionInfo" class="info-banner"></p>
            <div id="resolucionEquipo" class="equipo-banner"></div>

            <div class="form-group">
                <label for="rTecnico">Tecnico</label>
                <select id="rTecnico" required>
                    <option value="" disabled selected>Seleccionar tecnico...</option>
                </select>
            </div>

            <div class="row-fecha-hora">
                <div class="form-group half">
                    <label for="rFecha">Fecha</label>
                    <input type="date" id="rFecha" required>
                </div>

                <div class="form-group half">
                    <label>Hora</label>
                    <div class="time-picker">
                        <select id="rHoraHora" required>
                            <option value="" disabled selected>HH</option>
                        </select>
                        <span class="time-sep">:</span>
                        <select id="rHoraMinuto" required>
                            <option value="" disabled selected>MM</option>
                        </select>
                        <select id="rHoraPeriodo" class="time-periodo" required>
                            <option value="" disabled selected>AM/PM</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>¿Se arreglo la averia?</label>
                <div class="toggle-group">
                    <button type="button" class="toggle-btn" id="rSi" data-value="Si" onclick="toggleRealizado(this)">Si</button>
                    <button type="button" class="toggle-btn" id="rNo" data-value="No" onclick="toggleRealizado(this)">No</button>
                    <button type="button" class="toggle-btn" id="rProceso" data-value="En proceso" onclick="toggleRealizado(this)">En proceso</button>
                    <button type="button" class="toggle-btn" id="rFalsa" data-value="Falsa averia" onclick="toggleRealizado(this)">Falsa averia</button>
                </div>
            </div>

            <div class="form-group" id="rDescripcionGroup" style="display:none;">
                <label for="rDescripcion">Descripcion del motivo</label>
                <textarea id="rDescripcion" rows="3" placeholder="Por que no se realizo / en que quedo..."></textarea>
            </div>

            <div class="form-group">
                <label for="rImagenes">Fotos (maximo 2, opcional)</label>
                <input type="file" id="rImagenes" accept="image/*" multiple>
                <div id="rImagenesPreview" class="imagenes-preview"></div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-secondary" id="btnAtrasResolucion">Atras</button>
                <button type="submit" class="btn-primary" id="enviarResolucionBtn">Enviar </button>
            </div>
        </form>

        <div id="asignarSection" style="display:none;">
            <div class="card">
                <h2 style="color:#1976d2;margin-bottom:10px;">Asignar Averia</h2>
                <p id="asignarInfo" style="color:#666;margin-bottom:20px;"></p>

                <div class="form-group">
                    <label for="selTecnicoAsignar">Seleccionar tecnico:</label>
                    <select id="selTecnicoAsignar">
                        <option value="">Cargando tecnicos...</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-primary" id="btnAsignarTecnico" disabled>Asignar y Notificar</button>
                </div>

                <div id="asignarMsg" style="margin-top:15px;"></div>
                <div id="whatsappLink" style="margin-top:15px;display:none;"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>

    <footer>
        <p>© 2026 CCS.CATERING. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
